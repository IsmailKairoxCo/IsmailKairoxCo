<svg xmlns="http://www.w3.org/2000/svg" width="220" height="230" viewBox="0 0 220 230" role="img" aria-label="Animated robot mascot">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <style>
      .bot    { animation: bob 2.4s ease-in-out infinite; transform-origin: 110px 120px; }
      .eye    { animation: blink 4s infinite; transform-origin: center; transform-box: fill-box; }
      .antenna{ animation: glow 1.4s ease-in-out infinite alternate; }
      .shadow { animation: shrink 2.4s ease-in-out infinite; transform-origin: 110px 214px; }
      .arm    { animation: wave 1.2s ease-in-out infinite alternate; transform-origin: 166px 132px; }
      .line   { animation: type 3s steps(12) infinite; }
      .l2     { animation-delay: .5s } .l3 { animation-delay: 1s }
      @keyframes bob    { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
      @keyframes blink  { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(0.1) } }
      @keyframes glow   { from { fill: #f0abfc } to { fill: #67e8f9 } }
      @keyframes shrink { 0%,100% { transform: scaleX(1); opacity: .45 } 50% { transform: scaleX(.8); opacity: .25 } }
      @keyframes wave   { from { transform: rotate(-12deg) } to { transform: rotate(22deg) } }
      @keyframes type   { from { stroke-dashoffset: 48 } 60%,to { stroke-dashoffset: 0 } }
    </style>
  </defs>

  <ellipse class="shadow" cx="110" cy="214" rx="46" ry="7" fill="#a855f7"/>

  <g class="bot">
    <!-- antenna -->
    <line x1="110" y1="38" x2="110" y2="56" stroke="#c084fc" stroke-width="4" stroke-linecap="round"/>
    <circle class="antenna" cx="110" cy="34" r="7" fill="#f0abfc"/>
    <!-- head -->
    <rect x="62" y="56" width="96" height="70" rx="22" fill="url(#body)"/>
    <rect x="74" y="68" width="72" height="44" rx="14" fill="#0d1117"/>
    <rect class="eye" x="88" y="80" width="12" height="18" rx="6" fill="#67e8f9"/>
    <rect class="eye" x="120" y="80" width="12" height="18" rx="6" fill="#67e8f9"/>
    <path d="M100 104 Q110 110 120 104" stroke="#f0abfc" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- body -->
    <rect x="72" y="130" width="76" height="62" rx="16" fill="url(#body)"/>
    <!-- screen with typing code -->
    <rect x="82" y="140" width="56" height="40" rx="7" fill="#0d1117"/>
    <g stroke-width="3" stroke-linecap="round" stroke-dasharray="48">
      <line class="line"    x1="89" y1="150" x2="125" y2="150" stroke="#c084fc"/>
      <line class="line l2" x1="89" y1="160" x2="131" y2="160" stroke="#67e8f9"/>
      <line class="line l3" x1="89" y1="170" x2="115" y2="170" stroke="#5eead4"/>
    </g>
    <!-- arms -->
    <rect x="52" y="136" width="16" height="40" rx="8" fill="#7c3aed"/>
    <g class="arm"><rect x="152" y="104" width="16" height="40" rx="8" fill="#7c3aed"/></g>
    <!-- legs -->
    <rect x="86" y="192" width="16" height="16" rx="5" fill="#7c3aed"/>
    <rect x="118" y="192" width="16" height="16" rx="5" fill="#7c3aed"/>
  </g>
</svg>
