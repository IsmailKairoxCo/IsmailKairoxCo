<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Mohamed Ismail - Full-Stack Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#140f24"/>
      <stop offset="1" stop-color="#06131f"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="0.5" stop-color="#f0abfc"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a855f7" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath>
    <style>
      .blobA { animation: driftA 14s ease-in-out infinite alternate; }
      .blobB { animation: driftB 18s ease-in-out infinite alternate; }
      .grid  { animation: slide 6s linear infinite; }
      .star  { animation: twinkle 3s ease-in-out infinite; }
      .s2 { animation-delay: .6s } .s3 { animation-delay: 1.2s } .s4 { animation-delay: 1.8s } .s5 { animation-delay: 2.4s }
      .title { font: 800 64px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1px;
               animation: rise 1.2s ease-out both; }
      .sub   { font: 600 22px 'Fira Code', Consolas, 'Courier New', monospace; fill: #c9d1d9;
               animation: rise 1.2s ease-out .4s both; }
      .tag   { font: 600 15px 'Fira Code', Consolas, monospace; fill: #0d1117; }
      .chip  { animation: rise 1s ease-out both; }
      .c2 { animation-delay: .8s } .c3 { animation-delay: 1s } .c4 { animation-delay: 1.2s } .c5 { animation-delay: 1.4s }
      .cursor { animation: blink 1s steps(1) infinite; }
      .scan { animation: scan 5s linear infinite; }
      @keyframes driftA { from { transform: translate(0,0) } to { transform: translate(140px,40px) } }
      @keyframes driftB { from { transform: translate(0,0) } to { transform: translate(-160px,-30px) } }
      @keyframes slide  { from { transform: translate(0,0) } to { transform: translate(40px,40px) } }
      @keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: 1 } }
      @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
      @keyframes blink { 50% { opacity: 0 } }
      @keyframes scan { from { transform: translateY(-40px) } to { transform: translateY(340px) } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <g class="grid"><rect x="-40" y="-40" width="1280" height="380" fill="url(#grid)"/></g>
    <circle class="blobA" cx="220" cy="80" r="260" fill="url(#glowA)"/>
    <circle class="blobB" cx="1000" cy="230" r="280" fill="url(#glowB)"/>
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="#c084fc" opacity="0.18"/>

    <g fill="#e9d5ff">
      <circle class="star"    cx="80"   cy="40"  r="2"/>
      <circle class="star s2" cx="340"  cy="260" r="1.6"/>
      <circle class="star s3" cx="560"  cy="30"  r="2.2"/>
      <circle class="star s4" cx="880"  cy="60"  r="1.8"/>
      <circle class="star s5" cx="1120" cy="40"  r="2"/>
      <circle class="star s3" cx="1150" cy="250" r="1.6"/>
      <circle class="star s2" cx="40"   cy="230" r="1.8"/>
      <circle class="star s4" cx="700"  cy="275" r="1.6"/>
    </g>

    <!-- code brackets -->
    <g font-family="Fira Code, Consolas, monospace" font-weight="700" fill="#a855f7" opacity="0.35">
      <text x="70" y="190" font-size="120">{</text>
      <text x="1065" y="190" font-size="120">}</text>
    </g>

    <text class="title" x="600" y="128" text-anchor="middle" fill="url(#name)">Mohamed Ismail</text>
    <text class="sub" x="600" y="172" text-anchor="middle">&gt; Full-Stack Engineer @ KairoX AI Tech<tspan class="cursor" fill="#c084fc">_</tspan></text>

    <g transform="translate(600 222)">
      <g class="chip">   <rect x="-418" y="-17" width="140" height="34" rx="17" fill="#c084fc"/><text class="tag" x="-348" y="5" text-anchor="middle">Frontend</text></g>
      <g class="chip c2"><rect x="-266" y="-17" width="140" height="34" rx="17" fill="#a78bfa"/><text class="tag" x="-196" y="5" text-anchor="middle">Backend</text></g>
      <g class="chip c3"><rect x="-114" y="-17" width="228" height="34" rx="17" fill="#f0abfc"/><text class="tag" x="0"    y="5" text-anchor="middle">Testing · Security</text></g>
      <g class="chip c4"><rect x="126"  y="-17" width="140" height="34" rx="17" fill="#67e8f9"/><text class="tag" x="196"  y="5" text-anchor="middle">AI Research</text></g>
      <g class="chip c5"><rect x="278"  y="-17" width="140" height="34" rx="17" fill="#5eead4"/><text class="tag" x="348"  y="5" text-anchor="middle">n8n</text></g>
    </g>

    <rect width="1200" height="300" rx="18" fill="none" stroke="#a855f7" stroke-opacity="0.35" stroke-width="2"/>
  </g>
</svg>
